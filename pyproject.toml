[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "file-hash-browser"
version = "0.1.0"
description = "A lightweight, web-based file hash browser for authorized directories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "File Hash Browser contributors" }]
dependencies = []

[project.scripts]
file-hash-browser = "file_hash_browser.__main__:main"

[tool.setuptools.packages.find]
include = ["file_hash_browser*"]

[tool.setuptools.package-data]
file_hash_browser = ["static/*"]

